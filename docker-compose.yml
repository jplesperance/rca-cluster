# Sprint 1: local dev stack. One Redis, one orchestrator (run-once),
# one stub agent (long-running consumer). All state/artifacts on bind mounts.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  stub-recon:
    build: .
    command: python -u -m src.agents.stub_recon
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./artifacts:/app/artifacts
      - ./state:/app/state
    restart: unless-stopped

  orchestrator:
    build: .
    command: python -u -m src.orchestrator.main
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./artifacts:/app/artifacts
      - ./state:/app/state
    restart: "no"
